<div class="login__container">
  <h1 class="login__heading">
    Вход
  </h1>

  <div class="login__form">
    <app-input class="login__form--control" iconUrl="icons/user.svg" placeholder="Email" (controlValue)="onInputChange('username', $event)"/>

    <app-password-input class="login__form--control" iconUrl="icons/lock.svg" placeholder="Пароль" (controlValue)="onInputChange('password', $event)"/>

    @if (error) {
      <div class="login__form--errors">{{ error }}</div>
    }

    <app-button title="Войти" (btnClick)="onLoginClick()"/>
  </div>
</div>
