<div class="form__control">
  <div class="form__icon">
    <img [src]="iconUrl" width="24" height="24" alt="icon"/>
  </div>
  <input
    class="form__input"
    [type]="type"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [(ngModel)]="value"
    (input)="onInput($event)"
  />
  @if (buttonIconUrl) {
    <div class="form__button--container">
      <button class="form__button" type="button" (click)="onButtonToggleClick()">
        <img [src]="buttonIconUrl" width="16" height="16" [alt]="type" />
      </button>
    </div>
  }
</div>
