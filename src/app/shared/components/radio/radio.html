<div class="radio">
  @for (option of options; track option) {
    <label class="radio__item">
      <input
        type="radio"
        [value]="option.name"
        [checked]="value === option.id"
        (change)="onChange(option.id)"
      />

      <span class="radio__circle"></span>

      <span class="radio__label">
        {{ option.name }}
      </span>
    </label>
  }
</div>
