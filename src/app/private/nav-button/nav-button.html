<button
  class="nav__button"
  [disabled]="disabled"
  [ngClass]="{
    'nav__button--active': isActive(),
  }"
  (click)="onClick($event)">
  @if (isActive() && iconUrlActive) {
    <img [ngSrc]="iconUrlActive" width="24" height="24" alt="active icon" />
  } @else {
    <img [ngSrc]="iconUrl" width="24" height="24" alt="non-active icon" />
  }
  <span class="nav__text">
    {{ text }}
  </span>
</button>
