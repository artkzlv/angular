<button
  class="nav__button"
  [disabled]="disabled()"
  [routerLink]="routerLink()"
  routerLinkActive="nav__button--active"
  #rla="routerLinkActive"
  (click)="onClick($event)"
>
  @if (rla.isActive && iconUrlActive()) {
    <img
      [ngSrc]="iconUrlActive()"
      width="24"
      height="24"
      alt="active icon"
    />
  } @else {
    <img
      [ngSrc]="iconUrl()"
      width="24"
      height="24"
      alt="non-active icon"
    />
  }

  <span class="nav__text">
    {{ text() }}
  </span>
</button>
